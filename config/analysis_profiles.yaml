# 分析画像：按品类提供卖点词（features）与材质词（materials），供卖点词统计使用。
# 任务名归一化后（去掉「· 天猫」）包含 match 中任一关键词即命中；顺序即优先级（更具体的放前面）。
# 未命中时**不再退回通用词表**，而是由 profile_llm 用真实标题调用 LLM 生成并落库；
# 未配置 LLM 时只统计参数卖点（参数 key / value），不会用无关词硬凑结果。
profiles:
  - name: 水具
    match: ["保温杯", "水杯", "水壶", "杯"]
    capacity_enabled: true
    features:
      ["保温", "保冷", "显温", "吸管", "直饮", "大容量", "便携", "刻字", "儿童", "学生",
       "316", "304", "不锈钢", "礼盒", "密码锁", "学生"]
    materials: ["316不锈钢", "304不锈钢", "玻璃", "Tritan", "陶瓷", "塑料"]

  - name: 服饰户外
    match: ["冲锋衣", "夹克", "外套", "羽绒", "棉服", "冲锋裤", "防晒衣"]
    capacity_enabled: false
    features:
      ["防风", "防水", "三合一", "加绒", "加厚", "透气", "轻薄", "户外", "运动",
       "羽绒", "抓绒", "可拆卸", "连帽", "保暖"]
    materials: ["尼龙", "聚酯纤维", "Gore-Tex", "摇粒绒", "羽绒", "棉", "涤纶"]

  - name: 手表
    match: ["手表", "腕表", "手环"]
    capacity_enabled: false
    features:
      ["石英", "机械", "智能", "钢带", "皮带", "防水", "夜光", "蓝宝石", "运动",
       "计时", "日历", "情侣"]
    materials: ["不锈钢", "合金", "真皮", "硅胶", "钛", "陶瓷"]

  # 说明：不再提供「默认」画像。通用词表会让任意品类看起来「分析正常」，
  # 实际是把保温/便携之类无关词算进卖点，比空结果更误导。未命中请交给 LLM 生成。