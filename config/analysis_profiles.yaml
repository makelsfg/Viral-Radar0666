# 分析画像：按品类提供关键词/材质/功能词，供卖点聚类使用。
# 任务名（dim_task.name）包含 match 中任一关键词即命中；都不命中时使用「默认」。
profiles:
  - name: 水具
    match: ["保温杯", "水杯", "水壶", "杯"]
    capacity_enabled: true
    features:
      ["保温", "保冷", "显温", "吸管", "直饮", "大容量", "便携", "刻字", "儿童", "学生",
       "316", "304", "不锈钢", "礼盒", "密码锁", "学生"]
    materials: ["316不锈钢", "304不锈钢", "玻璃", "Tritan", "陶瓷", "塑料"]

  - name: 服饰户外
    match: ["冲锋衣", "夹克", "外套", "羽绒", "棉服", "冲锋裤", "防晒衣"]
    capacity_enabled: false
    features:
      ["防风", "防水", "三合一", "加绒", "加厚", "透气", "轻薄", "户外", "运动",
       "羽绒", "抓绒", "可拆卸", "连帽", "保暖"]
    materials: ["尼龙", "聚酯纤维", "Gore-Tex", "摇粒绒", "羽绒", "棉", "涤纶"]

  - name: 手表
    match: ["手表", "腕表", "手环"]
    capacity_enabled: false
    features:
      ["石英", "机械", "智能", "钢带", "皮带", "防水", "夜光", "蓝宝石", "运动",
       "计时", "日历", "情侣"]
    materials: ["不锈钢", "合金", "真皮", "硅胶", "钛", "陶瓷"]

  - name: 默认
    match: []
    capacity_enabled: true
    features:
      ["保温", "便携", "大容量", "户外", "运动", "防水", "智能", "礼盒", "升级款"]
    materials: ["不锈钢", "合金", "真皮", "塑料", "玻璃", "陶瓷", "尼龙"]